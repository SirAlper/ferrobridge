# `cargo deny check`: dependency licenses, security advisories, duplicate versions and sources.
# ferrobridge is `MIT OR Apache-2.0` (ADR-0003); only permissive licenses compatible with both are allowed.

[graph]
all-features = true

[advisories]
# Every advisory (vulnerable, unmaintained, yanked) fails the check unless it is listed here with a reason.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
# `ferrobridge-e2e` is not published (`publish = false`).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry a version too (needed for publishing), so they are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

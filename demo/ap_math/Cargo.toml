[package]
name = "ferrobridge-demo-ap-math"
description = "A demo using ArduPilot AP_Math from Rust with ferrobridge (ADR-0008)."
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
# Because it links against ArduPilot (GPL-3.0), this directory is GPL-3.0-or-later; ferrobridge itself
# stays MIT OR Apache-2.0 (ADR-0003, ADR-0008).
license = "GPL-3.0-or-later"
publish = false

# Not part of the root workspace: `cargo test --workspace` does not need ArduPilot.
[workspace]

[dependencies]
cxx = "1.0.198"
ferrobridge = { path = "../../crates/ferrobridge" }

[build-dependencies]
ferrobridge-build = { path = "../../crates/ferrobridge-build", features = ["generate"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# ferrobridge annotations for ArduPilot `AP_Math` (commit 437a3301cc).
#
# Every promise was made by reading the ArduPilot source; details above each section.

# ArduPilot does not use exceptions (the firmware is compiled with `-fno-exceptions`): functions
# return values directly instead of `Result`. If the promise is broken, the program ends.
[library]
exceptions = false

# Templates explicitly instantiated in the library's `.cpp`s (`template class Vector3<float>;`).
[templates]
Vector2f = "Vector2<float>"
Vector3f = "Vector3<float>"
Matrix3f = "Matrix3<float>"
Quaternion = "QuaternionT<float>"
Vector2d = "Vector2<double>"
Vector3d = "Vector3<double>"
Matrix3d = "Matrix3<double>"
QuaternionD = "QuaternionT<double>"

# ---- vector/matrix/quaternion ----
# The `to_euler` output parameters: only written (`quaternion.cpp`, `matrix3.cpp`),
# not kept. `Matrix3::to_euler` checks the pointers for null; because Rust always gives a
# valid reference, `borrowed` ("not null") is safe.
[functions."Quaternion::to_euler".params]
roll = "borrowed"
pitch = "borrowed"
yaw = "borrowed"

[functions."QuaternionD::to_euler".params]
roll = "borrowed"
pitch = "borrowed"
yaw = "borrowed"

[functions."Matrix3f::to_euler".params]
roll = "borrowed"
pitch = "borrowed"
yaw = "borrowed"

[functions."Matrix3d::to_euler".params]
roll = "borrowed"
pitch = "borrowed"
yaw = "borrowed"

# ---- crc ----
# Ownership annotations for `AP_Math/crc.h`. Every line was written by reading ArduPilot's `crc.cpp`
# (commit 437a3301cc): the pointer points to an array with as many elements as the length next to it,
# is only read, and is not kept.
#
# Deliberately not annotated:
# - `crc_crc4(uint16_t* data)`: no length parameter, a fixed 8 words are read; it cannot be a
#   `slice`, and `borrowed` ("a single object") would be wrong too.
# - `crc8_dvb_s2_update(..., const void* data, ...)`: `void*`, its type is unknown.

[functions.crc_crc8.params]
p = { slice = "len" }

[functions.crc8_generic.params]
buf = { slice = "buf_len" }

[functions.crc8_dvb_update.params]
buf = { slice = "buf_len" }

[functions.crc8_maxim.params]
data = { slice = "length" }

[functions.crc8_sae.params]
data = { slice = "length" }

[functions.crc8_rds02uf.params]
data = { slice = "length" }

[functions.crc_xor_of_bytes.params]
data = { slice = "length" }

[functions.crc_xmodem.params]
data = { slice = "len" }

[functions.crc_crc32.params]
buf = { slice = "size" }

[functions.crc32_small.params]
buf = { slice = "size" }

[functions.crc_crc24.params]
bytes = { slice = "len" }

# The pointer is not `const` but the array is only read; in Rust a more restrictive than needed `&mut [u8]`.
[functions.crc_crc16_ibm.params]
data_blk_ptr = { slice = "data_blk_size" }

[functions.crc_sum8_with_carry.params]
p = { slice = "len" }

[functions.crc16_ccitt.params]
buf = { slice = "len" }

[functions.crc16_ccitt_r.params]
buf = { slice = "len" }

[functions.crc16_ccitt_GDL90.params]
buf = { slice = "len" }

[functions.calc_crc_modbus.params]
buf = { slice = "len" }

[functions.crc_fletcher16.params]
buffer = { slice = "len" }

# `hash` is a single in-out value: `*hash` is read and written.
[functions.hash_fnv_1a.params]
buf = { slice = "len" }
hash = "borrowed"

# `num_words`: the number of `uint32_t` elements.
[functions.crc_crc64.params]
data = { slice = "num_words" }

[functions.crc_sum_of_bytes.params]
data = { slice = "count" }

[functions.crc_sum_of_bytes_16.params]
data = { slice = "count" }

# ---- control ----
# `AP_Math/control.h`: the `float&` / `postype_t&` parameters are in-out values; the functions
# (`control.cpp`) only read and write them during the call, and do not keep them.

[functions.update_vel_accel.params]
vel = "borrowed"

[functions.update_pos_vel_accel.params]
pos = "borrowed"
vel = "borrowed"

[functions.shape_accel.params]
accel = "borrowed"

[functions.shape_vel_accel.params]
accel = "borrowed"

[functions.shape_pos_vel_accel.params]
accel = "borrowed"

[functions.shape_angle_vel_accel.params]
angle_accel = "borrowed"

[functions.rc_input_to_roll_pitch_rad.params]
roll_out_rad = "borrowed"
pitch_out_rad = "borrowed"

# ---- ap_math ----
# `AP_Math/AP_Math.h`. The two overloads of `fill_nanf` (`float*`, `double*`) share the same
# key; both fill an array of `count` elements with NaN (`AP_Math.cpp`).

[functions.fill_nanf.params]
f = { slice = "count" }

# ---- scurve ----
# `AP_Math/SCurve.h`: the `*_out` parameters of `calculate_path` are output values only.

[functions."SCurve::calculate_path".params]
Jm_out = "borrowed"
tj_out = "borrowed"
t2_out = "borrowed"
t4_out = "borrowed"
t6_out = "borrowed"


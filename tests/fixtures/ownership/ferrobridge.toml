# Ownership annotations (see input.h). Every line is a promise about the C++ library.

[functions."own::make_widget"]
returns = "owned"

[functions."own::make_null_widget"]
returns = "owned"

[functions."own::make_label"]
returns = "owned"

[functions."own::make_square"]
returns = "owned"

# Rejected even though the promise is made: Leaky's destructor is not virtual.
[functions."own::make_leaky"]
returns = "owned"

[functions."own::Widget::child"]
returns = "borrowed"

[functions."own::Widget::child_view"]
returns = "borrowed"

[functions."own::Widget::child_named"]
returns = "borrowed"

[functions."own::Widget::weight_slot"]
returns = "borrowed"

[functions."own::Widget::weight"]
returns = "borrowed"

[functions."own::Widget::Widget".params]
prototype = "borrowed"

[functions."own::Widget::copy_id_from".params]
other = "borrowed"

[functions."own::Widget::swap_ids".params]
other = "borrowed"

[functions."own::Widget::read_weight".params]
out = "borrowed"

[functions."own::Widget::read_id".params]
out = "borrowed"

[functions."own::scale".params]
value = "borrowed"

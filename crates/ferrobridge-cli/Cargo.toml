[package]
name = "ferrobridge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
ferrobridge-analysis.workspace = true
ferrobridge-codegen.workspace = true
ferrobridge-parser.workspace = true
serde_json = "1.0.154"

[lints]
workspace = true

[[bin]]
name = "ferrobridge"
path = "src/main.rs"
# So the docs do not clash with the runtime library of the same name (`crates/ferrobridge`).
doc = false

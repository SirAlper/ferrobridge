[package]
name = "ferrobridge-codegen"
description = "Generates the cxx bridge, the C++ shim and the safe Rust API from a ferrobridge plan. An implementation detail of ferrobridge; no stability guarantee."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# The tests read the fixtures at the repository root; they run from the repository, not from the package.
exclude = ["tests/"]

[dependencies]
ferrobridge-analysis.workspace = true
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full"] }
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
ferrobridge-parser.workspace = true
insta = "1.49.0"

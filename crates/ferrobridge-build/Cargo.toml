[package]
name = "ferrobridge-build"
description = "Builds ferrobridge bridges from `build.rs`: committed generated files or (with the `generate` feature) files generated during the build."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["development-tools::ffi", "development-tools::build-utils"]
readme = "README.md"
# The tests read the fixtures at the repository root; they run from the repository, not from the package.
exclude = ["tests/"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
# Reads the header with libclang inside `build.rs` and generates the bridge into `OUT_DIR`. Needs libclang.
generate = ["dep:ferrobridge-parser", "dep:ferrobridge-analysis", "dep:ferrobridge-codegen"]

[dependencies]
cxx-build = "1.0.198"
ferrobridge-analysis = { workspace = true, optional = true }
ferrobridge-codegen = { workspace = true, optional = true }
ferrobridge-parser = { workspace = true, optional = true }
thiserror = "2.0.21"

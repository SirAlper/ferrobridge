[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
# Open source (ADR-0003). Publishing to crates.io opens with v0.1; disabled until then.
publish = false

# The internal dependency graph. When a crate really starts using another, add
# `<name>.workspace = true` here and in that crate's [dependencies] section:
#   parser   -> ir          (connected)
#   analysis -> ir          (connected)
#   codegen  -> analysis    (connected; the plan types are in analysis)
#   build    -> parser, analysis, codegen (connected, only with the `generate` feature)
#   cli      -> parser, analysis, codegen (connected); build later
#   ferrobridge (runtime) -> cxx only; crates using the generated code depend on it
# Rule: ir may not depend on any ferrobridge crate.
[workspace.dependencies]
ferrobridge-ir = { path = "crates/ferrobridge-ir" }
ferrobridge-parser = { path = "crates/ferrobridge-parser" }
ferrobridge-analysis = { path = "crates/ferrobridge-analysis" }
ferrobridge-codegen = { path = "crates/ferrobridge-codegen" }
ferrobridge-build = { path = "crates/ferrobridge-build" }
ferrobridge = { path = "crates/ferrobridge" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

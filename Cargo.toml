[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
# Açık kaynak (ADR-0003). crates.io yayını v0.1'de (Milestone 6) açılacak; o zamana kadar kapalı.
publish = false

# İç bağımlılık grafiği (Obsidian `03 Mimari`). Bir crate diğerini gerçekten kullanmaya
# başladığında buraya ve o crate'in [dependencies] bölümüne `<ad>.workspace = true` eklenir:
#   parser   -> ir          (bağlı)
#   analysis -> ir
#   codegen  -> ir
#   build    -> parser, analysis, codegen
#   cli      -> parser (şimdilik), ileride build
# Kural: ir hiçbir ferrobridge crate'ine bağımlı olamaz.
[workspace.dependencies]
ferrobridge-ir = { path = "crates/ferrobridge-ir" }
ferrobridge-parser = { path = "crates/ferrobridge-parser" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
